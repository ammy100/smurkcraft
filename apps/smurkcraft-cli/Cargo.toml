[package]
name = "smurkcraft-cli"
description = "Headless Smurkcraft: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional smurkcraft-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["smurkcraft-codecs/heif"]

[lints]
workspace = true

[lib]
name = "smurkcraft_cli"
path = "src/lib.rs"

[[bin]]
name = "smurkcraft-cli"
path = "src/main.rs"

[dependencies]
smurkcraft-automation = { path = "../../crates/automation" }
smurkcraft-engine = { workspace = true }
smurkcraft-io = { workspace = true }
smurkcraft-format = { path = "../../crates/format" }
smurkcraft-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for smurkcraft-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

